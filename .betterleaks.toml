# Betterleaks secret scanner config, used by the `secret-scan` workflow. The built-in
# rules apply (`[extend]` below); `filter` only discards findings, and a finding is
# discarded when the expression is true.
#
# Setting `filter` replaces the built-in global filter instead of adding to it
# (betterleaks 1.10.0). Its discards of placeholder values such as `$VAR` no longer
# apply; each built-in rule's own filter still does.
title = "speckle-sharp-connectors betterleaks config"

filter = '''
let path = attributes["path"];
let rule = finding["rule_id"];
let secret = finding["secret"];
let line = finding["line"];

// Local dev database of the importer launch profile.
(rule == "generic-credential-uri" && secret == "speckle" && matchesAny(path, [`(?:^|/)Properties/launchSettings\.json$`]))

// The PostHog project key (`phc_`) of the connectors: sent by every client, public by design.
|| (rule == "posthog-project-api-key" && matchesAny(path, [`(?:^|/)Sdk/Speckle\.Connectors\.Common/Analytics/PostHogManager\.cs$`]))

// Token of the telemetry gateway: compiled into every connector, so public by design.
|| (rule == "generic-api-key" && matchesAny(line, [`CONNECTOR_GATEWAY_TOKEN = `]) && matchesAny(path, [`(?:^|/)Sdk/Speckle\.Connectors\.Common/Connector\.cs$`]))
'''

[extend]
useDefault = true
