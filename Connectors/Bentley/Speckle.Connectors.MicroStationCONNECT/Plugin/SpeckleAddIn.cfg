# Speckle MicroStation 2026 Connector
# -------------------------------------------------------
# Installation: copy this file to
#   %APPDATA%\Bentley\MicroStation 2026\prefs\
# The post-build target does this automatically on the developer machine.

SPECKLE_MICROSTATION_DIR = C:\ProgramData\Speckle\Connectors\MicroStation\2026\

# Dependency path: where Speckle DLLs live (assembly resolver uses this)
MS_ADDIN_DEPENDENCYPATH > $(SPECKLE_MICROSTATION_DIR)

# Add-in path: MicroStation also probes here for the assembly
MS_ADDINPATH            > $(SPECKLE_MICROSTATION_DIR)

# Load the Speckle connector as an in-process managed add-in.
# MS_DGNAPPS names the assembly (without .dll); MicroStation loads it and
# calls the [AddIn]-decorated class via the Bentley.MstnPlatformNET hosting infrastructure.
MS_DGNAPPS              > Speckle.Connectors.MicroStation2026
