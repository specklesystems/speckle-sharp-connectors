# Speckle OpenBridge Designer 2025 (OpenBridge Modeler) Connector
# -------------------------------------------------------
# Installation: copy this file to
#   %LOCALAPPDATA%\Bentley\OpenBridgeModeler\<prefs-version>\prefs\
# The post-build target does this automatically on the developer machine.

SPECKLE_OPENBRIDGEDESIGNER_DIR = C:\ProgramData\Speckle\Connectors\OpenBridgeModeler\2025\

# Dependency path: where Speckle DLLs live (assembly resolver uses this)
MS_ADDIN_DEPENDENCYPATH > $(SPECKLE_OPENBRIDGEDESIGNER_DIR)

# Add-in path: the host also probes here for the assembly
MS_ADDINPATH            > $(SPECKLE_OPENBRIDGEDESIGNER_DIR)

# Load the Speckle connector as an in-process managed add-in.
MS_DGNAPPS              > Speckle.Connectors.OpenBridgeDesigner2025
