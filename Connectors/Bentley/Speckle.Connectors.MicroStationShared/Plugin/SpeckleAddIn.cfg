# Speckle MicroStation 2026 Connector Configuration
# -------------------------------------------------------
# Installation:
#   Copy this file to one of these locations:
#     %APPDATA%\Bentley\MicroStation 2026\prefs\
#     %LOCALAPPDATA%\Bentley\MicroStation 2026\prefs\
#   Or place it in a workspace/workset Organisation configuration folder.
#
# Update SPECKLE_MICROSTATION_DIR to the folder containing
#   Speckle.Connectors.MicroStation2026.dll
#   (typically set automatically by the Speckle installer)

SPECKLE_MICROSTATION_DIR = C:\ProgramData\Speckle\Connectors\MicroStation\2026\

# Root folder: where the connector DLLs live (assembly resolver path)
MS_ADDINPATH         > $(SPECKLE_MICROSTATION_DIR)

# Plugin subfolder: where Speckle.addin is located
MS_ADDINPATH         > $(SPECKLE_MICROSTATION_DIR)Plugin\

# Note: MS_DGNAPPS is for native MDL (.ma) files only — not used for managed assemblies.
# MicroStation discovers Speckle.addin via MS_ADDINPATH and loads it automatically.
