# Speckle OpenRoads Designer 2025 Connector
# -------------------------------------------------------
# Installation: copy this file to
#   %LOCALAPPDATA%\Bentley\OpenRoadsDesigner\<prefs-version>\prefs\
# The post-build target does this automatically on the developer machine.

SPECKLE_OPENROADSDESIGNER_DIR = C:\ProgramData\Speckle\Connectors\OpenRoadsDesigner\2025\

# Dependency path: where Speckle DLLs live (assembly resolver uses this)
MS_ADDIN_DEPENDENCYPATH > $(SPECKLE_OPENROADSDESIGNER_DIR)

# Add-in path: the host also probes here for the assembly
MS_ADDINPATH            > $(SPECKLE_OPENROADSDESIGNER_DIR)

# Load the Speckle connector as an in-process managed add-in.
# MS_DGNAPPS names the assembly (without .dll); the host loads it and
# calls the [AddIn]-decorated class via the Bentley.MstnPlatformNET hosting infrastructure.
MS_DGNAPPS              > Speckle.Connectors.OpenRoadsDesigner2025
